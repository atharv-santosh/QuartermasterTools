[project]
name = "agent-tool-gateway"
version = "0.1.0"
description = "Tool retrieval and routing for agents with catalogs too large to fit in context, plus an MCP multiplexing gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
atg = "atg.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
gemini = ["google-genai>=1.0", "google-auth>=2.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
